# Copy to solar.conf if you want to change settings before the first launch.
# solar.conf is local and ignored by Git. Credentials are generated on first run.
[server]
hosts = ["0.0.0.0", "::"]
port = 5557
allowed_hosts = []
tls = true
certificate = ""
private_key = ""

[storage]
directory = ".solar"
max_file_mb = 50
quota_mb = 2048
export_mb = 250

[execution]
max_workers = 3
timeout_seconds = 3600
native_idle_seconds = 1800

[desktop]
enabled = true
fps = 4
max_width = 1600
idle_seconds = 300
max_minutes = 60

[providers]
# Only these origins may receive API requests. API keys are stored per user, encrypted.
allowed_api_origins = ["http://127.0.0.1:11434", "http://127.0.0.1:1234", "https://api.openai.com"]

[bootstrap]
# First run adds: user_id, username_encrypted, password_encrypted, password_hash.
# The initial password is randomly generated; there is no shared default password.
# uv run solar credentials displays it locally. A first-login change is mandatory.
