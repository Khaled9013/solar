[project]
name = "solar-workspace"
version = "0.1.0"
description = "A private, self-hosted workspace for coding agents and remote work"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2.18,<5.3",
  "argon2-cffi>=23.1",
  "cryptography>=46",
  "uvicorn>=0.35",
  "wsproto>=1.2",
  "httpx>=0.28",
  "filelock>=3.18",
  "python-dateutil>=2.9",
  "psutil>=7",
  "pillow>=12",
  "mss>=10",
  "pynput>=1.7.7",
  "tomlkit>=0.13",
  "tzdata>=2025.2",
]

[project.scripts]
solar = "solar.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solar*"]

[tool.setuptools.package-data]
solar = ["templates/*.html", "static/*.js", "static/*.css", "static/vendor/*", "static/vendor/pdfjs/**/*"]

[dependency-groups]
dev = ["ruff>=0.11", "pip-audit>=2.9", "playwright>=1.51"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["S101", "S105", "S106", "S603", "S607", "S311"]

[tool.uv]
cache-dir = ".uv-cache"
